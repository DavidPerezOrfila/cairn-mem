[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-mem"
version = "0.2.1"
description = "Memoria persistente para agentes de código: CLI + archivos, sin LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/DavidPerezOrfila/cairn-mem"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
cairn = "cairn_mem.cli:main"
cairn-mem = "cairn_mem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
