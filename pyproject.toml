[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-mem"
version = "0.10.0"
description = "Project memory for coding agents: plain files, CLI and MCP, no LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "coding-agents", "memory", "mcp", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/DavidPerezOrfila/cairn-mem"
Issues = "https://github.com/DavidPerezOrfila/cairn-mem/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
cairn = "cairn_mem.cli:main"
cairn-mem = "cairn_mem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
